<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Scratch.Get "docName" | default .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ if .IsHome }}{{ site.Params.description }}{{ else }}{{ .Description | default site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="preload" href="{{ "fonts/carlito-regular.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
{{ $css := resources.Get "css/site.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}">
{{ partial "extend_head.html" . }}
