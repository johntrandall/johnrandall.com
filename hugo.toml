baseURL = 'https://johnrandall.com/'
languageCode = 'en-us'
title = 'John Randall'
# PaperMod stays installed for any future blog, but the landing page and the
# document pages use this site's own templates (layouts/index.html,
# layouts/_default/cv.html) and stylesheet (assets/css/site.css).
theme = 'PaperMod'

[params]
  tagline = "Software engineer in Montclair, NJ."
  description = "John Randall, software engineer in Montclair, NJ."

  [[params.profiles]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/johntrandall/"
    icon = "linkedin"
  [[params.profiles]]
    name = "GitHub"
    url = "https://github.com/johntrandall"
    icon = "github"
  [[params.profiles]]
    name = "john@johnrandall.com"
    url = "mailto:john@johnrandall.com"
    icon = "mail"

  # The documents, shortest first. Each appears on the landing page and in the
  # document switcher only once a page exists at its URL. Every document has
  # three formats: the page itself, its PDF and its JSON Resume.
  [[params.documents]]
    url = "/resume/"
    name = "Résumé"
  [[params.documents]]
    url = "/cv/"
    name = "CV"
  [[params.documents]]
    url = "/cv/full/"
    name = "Full CV"

# Every document page uses layouts/_default/cv.html. These are content paths
# (content/cv-full/index.md is /cv-full), not URLs.
[[cascade]]
  layout = "cv"
  [cascade.target]
    path = "{/cv,/cv/**,/cv-full,/cv-full/**,/resume,/resume/**}"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # the CV page's download paragraph is inline HTML (generated)
