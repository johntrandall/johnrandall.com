baseURL = 'https://johnrandall.com/'
languageCode = 'en-us'
title = 'John Randall'
theme = 'PaperMod'

[params]
  defaultTheme = "auto"
  disableSpecial1stPost = true

  [params.profileMode]
    enabled = true
    title = "John Randall"
    subtitle = "Software engineer in Montclair, NJ."

    [[params.profileMode.buttons]]
      name = "CV"
      url = "/cv/full/"
    [[params.profileMode.buttons]]
      name = "CV as PDF"
      url = "/cv/john-randall-cv-full.pdf"
    [[params.profileMode.buttons]]
      name = "CV as JSON Resume"
      url = "/cv/john-randall-cv-full.json"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/johntrandall"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/johntrandall/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:john@johnrandall.com"

  [[params.socialIcons]]
    name = "cv"
    url = "/cv/full/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true   # the CV page's icon download links are inline HTML (tools/publish-cv)
